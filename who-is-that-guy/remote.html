<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12001f">
<title>HOST REMOTE · WHO THE F*** IS THAT GUY</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#12001f;color:#fff7e6;font-family:'Space Mono',monospace;overscroll-behavior:none}
body{width:100%;max-width:100vw;overflow-x:hidden;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px;min-height:100dvh}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff2d55;margin-right:6px;vertical-align:middle}
.dot.ok{background:#39ff14;box-shadow:0 0 10px #39ff14}
.secret{background:#000;border:3px solid #ffd400;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;min-height:96px}
.secret img{width:72px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:#222}
.secret>div{min-width:0;flex:1}
.stats div{min-width:0}
.secret .who{overflow-wrap:anywhere;font-family:'Bungee';font-size:24px;line-height:1.05;color:#ffd400}
.secret .tag{font-size:12px;opacity:.8;margin-top:4px}
.secret .lbl{font-size:11px;color:#ff2d95;letter-spacing:2px}
.stats{display:flex;gap:8px;font-family:'Bungee';font-size:14px}
.stats div{flex:1;background:rgba(255,255,255,.07);border-radius:10px;padding:6px;text-align:center}
.stats b{display:block;font-size:22px;color:#00e5ff}
.phase{font-family:'Bungee';text-align:center;font-size:13px;color:#00e5ff;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
button{font-family:'Bungee';border:none;border-radius:18px;color:#fff;font-size:24px;padding:10px;touch-action:manipulation}
button:active{transform:scale(.96);filter:brightness(1.3)}
button:disabled{opacity:.25}
.correct{background:linear-gradient(180deg,#5bff3a,#19a800);box-shadow:0 6px 0 #0d5c00;grid-column:1;min-height:150px;font-size:30px;color:#03200a}
.wrong{background:linear-gradient(180deg,#ff5577,#c4002b);box-shadow:0 6px 0 #6a0018;grid-column:2;min-height:150px;font-size:30px}
.next{background:linear-gradient(180deg,#5ff0ff,#00a7c2);box-shadow:0 6px 0 #005866;grid-column:1/3;color:#12001f;min-height:80px}
.small{background:#2b1146;font-size:15px;box-shadow:0 4px 0 #13051f;min-height:56px}
.pass{background:#6b4b00}
.start{display:none;flex-direction:column;gap:10px}
.start button{min-height:90px}
.full{background:linear-gradient(180deg,#ff5fb0,#ff2d95);box-shadow:0 6px 0 #8a0047}
.quick{background:linear-gradient(180deg,#5ff0ff,#00b8d4);color:#12001f;box-shadow:0 6px 0 #006b7a}
body.title .start{display:flex}
body.title .play{display:none}
.err{color:#ff2d55;font-size:12px;text-align:center}
</style>
</head>
<body class="title">
  <div class="top"><span><span class="dot" id="dot"></span><span id="status">connecting…</span></span><span>ROOM <b id="room"></b></span></div>
  <div class="secret">
    <img id="face" alt="">
    <div>
      <div class="lbl">🤫 ANSWER (DON'T LET HER SEE)</div>
      <div class="who" id="who">—</div>
      <div class="tag" id="tag"></div>
    </div>
  </div>
  <div class="stats"><div>ROUND<b id="round">0/0</b></div><div>SCORE<b id="score">0</b></div><div>POINTS<b id="pts">1000</b></div></div>
  <div class="phase" id="phase">WAITING FOR TV</div>

  <div class="start">
    <button class="full" data-c="start" data-a="full">🎬 FULL SHOW · 40</button>
    <button class="quick" data-c="start" data-a="quick">⚡ QUICKIE · 15</button>
  </div>

  <div class="grid play">
    <button class="correct" data-c="correct">✅ CORRECT</button>
    <button class="wrong" data-c="wrong">❌ WRONG</button>
    <button class="next" data-c="next">NEXT ▶</button>
    <button class="small pass" data-c="pass">🐔 PASS</button>
    <button class="small" data-c="roast">🔥 ROAST HER</button>
    <button class="small" data-c="airhorn">📯 AIRHORN</button>
    <button class="small" data-c="applause">👏 APPLAUSE</button>
  </div>
  <div class="err" id="err"></div>

<script src="vendor/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const room=(new URLSearchParams(location.search).get("room")||"").toUpperCase();
$("#room").textContent=room||"?";
let conn=null, peer=null;
const PH={title:"READY TO START",host:"HOST IS TALKING · NEXT TO SKIP",act:"ACT CARD",guess:"🔴 LIVE · SHE'S GUESSING",judged:"REACTION · NEXT TO SKIP",revealed:"REVEALED · HIT NEXT",end:"GAME OVER"};
function render(s){
  document.body.className = (s.phase==="title"||s.phase==="end")?"title":"";
  $("#phase").textContent=PH[s.phase]||s.phase;
  $("#round").textContent=`${s.round}/${s.total}`; $("#score").textContent=s.score.toLocaleString(); $("#pts").textContent=s.pts;
  const live=s.phase==="guess";
  document.querySelectorAll(".correct,.wrong,.pass").forEach(b=>b.disabled=!live);
  if(s.name && s.phase!=="title"){ $("#who").textContent=s.name; $("#tag").textContent=s.tag; $("#face").src=s.img; }
  else if(s.upcoming){ $("#who").textContent="Next: "+s.upcoming; $("#tag").textContent=""; }
  if(s.phase==="end"){ $("#who").textContent="FINAL: "+s.score.toLocaleString(); }
  if(navigator.vibrate && live) navigator.vibrate(30);
}
function status(t,ok){ $("#status").textContent=t; $("#dot").classList.toggle("ok",!!ok); }
function connect(){
  if(!room){ status("no room code in URL"); return; }
  if(!peer || peer.destroyed){ peer=new Peer({debug:0}); peer.on("error",e=>{ status("error: "+e.type); setTimeout(retry,2000); }); peer.on("open",dial); }
  else dial();
}
function dial(){
  status("dialing TV…");
  conn=peer.connect("wtfitg-"+room,{reliable:true});
  conn.on("open",()=>{ status("connected to TV",true); conn.send({cmd:"hello"}); });
  conn.on("data",d=>{ if(d.type==="state") render(d); if(d.type==="pts") $("#pts").textContent=d.pts; });
  conn.on("close",()=>{ status("lost TV, reconnecting…"); setTimeout(retry,1500); });
}
function retry(){ if(conn && conn.open) return; if(peer && peer.disconnected && !peer.destroyed) { try{peer.reconnect();}catch(e){} } connect(); }
document.querySelectorAll("button[data-c]").forEach(b=>b.addEventListener("click",()=>{
  if(!conn||!conn.open){ $("#err").textContent="not connected to the TV yet"; retry(); return; }
  $("#err").textContent=""; conn.send({cmd:b.dataset.c,arg:b.dataset.a}); if(navigator.vibrate) navigator.vibrate(15);
}));
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) retry(); });
connect();
</script>
</body>
</html>
